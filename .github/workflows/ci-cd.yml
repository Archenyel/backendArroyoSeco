name: CI/CD - Build and Deploy

on:
  push:
    branches: [ docker ] 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write 

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Convertir repositorio a minúsculas
      id: string
      shell: bash
      run: |
        echo "repo=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }} 

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ steps.string.outputs.repo }}:latest
          ghcr.io/${{ steps.string.outputs.repo }}:${{ github.sha }}

  # --- Segundo Job: Despliegue ---

  deploy:
    needs: build-and-push # Se ejecuta SOLO si 'build-and-push' fue exitoso
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to DigitalOcean VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        # port: 22 # No es necesario si usas el puerto 22
        script: |
          cd /home/user/mi-app 
          
          docker compose pull
          
          docker compose up -d
          
          docker image prune -f